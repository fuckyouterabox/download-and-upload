name: Download and Upload to TeraBox

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "URL HTTP/HTTPS del archivo que se desea descargar"
        required: true
        type: string

jobs:
  upload-to-terabox:
    name: Download and upload file
    runs-on: ubuntu-latest

    env:
      TERABOX_COOKIE: ${{ secrets.TERABOX_COOKIE }}

    steps:
      - name: Install aria2
        shell: bash
        run: |
          set -ex

          sudo apt-get update -y
          sudo apt-get install -y -V aria2

          aria2c --version

      - name: Check inputs
        shell: bash
        run: |
          set -ex

          if [[ -z "${TERABOX_COOKIE}" ]]; then
            echo "::error::El secret TERABOX_COOKIE no está configurado."
            exit 1
          fi

          if [[ -z "${{ inputs.download_url }}" ]]; then
            echo "::error::No se proporcionó una URL de descarga."
            exit 1
          fi

      - name: Download TeraBox CLI
        shell: bash
        run: |
          set -ex
          mkdir -pv temptbc
          
          # -v fuerza a curl a mostrar todo el intercambio de headers y redirecciones
          curl -fL -v \
            "https://github.com/fuckyouterabox/tbc-revived/releases/download/v0.1.3/tbc_Linux_x86_64.tar.gz" \
            -o temptbc/tbc_Linux_x86_64.tar.gz

      - name: Extract TeraBox CLI archive
        shell: bash
        run: |
          set -ex
          
          # Añadida la 'v' (verbose) al comando tar para listar los archivos extraídos
          tar -xzvf temptbc/tbc_Linux_x86_64.tar.gz -C temptbc

      - name: Copy tbc binary to root
        shell: bash
        run: |
          set -ex
          
          # Copia y permisos con bandera verbose (-v)
          cp -v temptbc/tbc ./tbc
          chmod -v +x ./tbc
          
          echo "TeraBox CLI:"
          ./tbc --help

      - name: Download requested file with aria2
        shell: bash
        run: |
          set -ex

          mkdir -pv downloaded

          URL="${{ inputs.download_url }}"

          FILE_NAME="$(basename "${URL%%\?*}")"

          if [[ -z "${FILE_NAME}" || "${FILE_NAME}" == "/" || "${FILE_NAME}" == "." ]]; then
            echo "::error::No se pudo determinar el nombre del archivo desde la URL."
            exit 1
          fi

          echo "Descargando: ${URL}"
          echo "Archivo: ${FILE_NAME}"

          # --console-log-level=debug activa los logs máximos del motor de aria2
          aria2c \
            -x 4 \
            -s 4 \
            --console-log-level=debug \
            --dir=downloaded \
            --out="${FILE_NAME}" \
            "${URL}"

          echo "DOWNLOADED_FILE=downloaded/${FILE_NAME}" >> "$GITHUB_ENV"

      - name: Build TeraBox destination path
        shell: bash
        run: |
          set -ex

          URL="${{ inputs.download_url }}"

          # Extraer solamente el path de la URL:
          # https://example.com/foo/bar/file.zip -> /foo/bar/file.zip
          URL_PATH="$(python3 -c 'from urllib.parse import urlparse; import os,sys; print(urlparse(sys.argv[1]).path)' "$URL")"

          if [[ -z "${URL_PATH}" || "${URL_PATH}" == "/" ]]; then
            echo "::error::No se pudo obtener la ruta desde la URL."
            exit 1
          fi

          # TeraBox: /Archive + path de la URL
          REMOTE_PATH="/Archive${URL_PATH}"

          echo "URL: ${URL}"
          echo "URL path: ${URL_PATH}"
          echo "Destino TeraBox: ${REMOTE_PATH}"

          echo "REMOTE_PATH=${REMOTE_PATH}" >> "$GITHUB_ENV"

      - name: Upload file to TeraBox
        shell: bash
        run: |
          set -ex

          echo "Archivo local: ${DOWNLOADED_FILE}"
          echo "Destino remoto: ${REMOTE_PATH}"

          ./tbc put "${DOWNLOADED_FILE}" -d "${REMOTE_PATH}"

      - name: Show result
        shell: bash
        run: |
          set -ex
          echo "========================================"
          echo "Upload completed successfully"
          echo "File: ${DOWNLOADED_FILE}"
          echo "Remote path: ${REMOTE_PATH}"
          echo "========================================"
