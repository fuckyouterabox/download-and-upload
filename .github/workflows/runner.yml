name: Download and Upload to TeraBox Premium

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "URL HTTP/HTTPS de un archivo o carpeta h5ai"
        required: true
        type: string

jobs:
  upload-to-terabox:
    name: Premium Parallel Download and Upload
    runs-on: ubuntu-latest

    env:
      TERABOX_JSTOKEN: ${{ secrets.TERABOX_JSTOKEN }}
      TERABOX_COOKIE: ${{ secrets.TERABOX_COOKIE }}

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update -y
          sudo apt-get install -y aria2 curl jq python3

          aria2c --version
          curl --version
          jq --version
          python3 --version

      - name: Check inputs and environment
        shell: bash
        run: |
          set -euxo pipefail

          if [[ -z "${TERABOX_COOKIE}" ]]; then
            echo "::error::El secret TERABOX_COOKIE no está configurado."
            exit 1
          fi

          if [[ -z "${TERABOX_JSTOKEN}" ]]; then
            echo "::error::El secret TERABOX_JSTOKEN no está configurado."
            exit 1
          fi

          if [[ -z "${{ inputs.download_url }}" ]]; then
            echo "::error::No se proporcionó una URL."
            exit 1
          fi

      - name: Detect URL type and build download list
        shell: bash
        run: |
          set -euxo pipefail

          URL="${{ inputs.download_url }}"

          mkdir -p downloaded

          echo "URL recibida:"
          echo "${URL}"

          # ----------------------------------------------------------
          # Descargar la URL inicial.
          # ----------------------------------------------------------

          HTML_FILE="index.html"

          curl \
            --silent \
            --show-error \
            --fail \
            --location \
            --user-agent "Mozilla/5.0" \
            --output "${HTML_FILE}" \
            "${URL}"

          # ----------------------------------------------------------
          # Determinar si es un índice HTML h5ai.
          # ----------------------------------------------------------

          if grep -q '<ul id="items"' "${HTML_FILE}" && \
             grep -q 'class="item file"' "${HTML_FILE}"; then

            echo "Se detectó un índice h5ai."

            export BASE_URL="${URL}"

            python3 <<'PY'
          import os
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          class H5AIParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_file = False
                  self.in_a = False
                  self.href = None
                  self.files = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if tag == "li":
                      classes = attrs.get("class", "").split()

                      if "item" in classes and "file" in classes:
                          self.in_file = True

                  elif tag == "a" and self.in_file:
                      self.in_a = True
                      self.href = attrs.get("href")

              def handle_endtag(self, tag):
                  if tag == "a" and self.in_a:
                      if self.href:
                          self.files.append(self.href)

                      self.href = None
                      self.in_a = False

                  elif tag == "li" and self.in_file:
                      self.in_file = False

          base_url = os.environ["BASE_URL"]

          with open("index.html", "r", encoding="utf-8", errors="ignore") as f:
              html = f.read()

          parser = H5AIParser()
          parser.feed(html)

          with open("download_list.txt", "w", encoding="utf-8") as f:
              for href in parser.files:
                  full_url = urljoin(base_url, href)
                  f.write(full_url + "\n")

          print(f"Archivos encontrados: {len(parser.files)}")

          for href in parser.files:
              print(urljoin(base_url, href))
          PY

          else

            echo "No parece ser un índice h5ai."
            echo "Tratándolo como archivo individual."

            printf '%s\n' "${URL}" > download_list.txt

          fi

          FILE_COUNT="$(wc -l < download_list.txt)"

          if [[ "${FILE_COUNT}" -eq 0 ]]; then
            echo "::error::No se encontraron archivos para descargar."
            exit 1
          fi

          echo "=========================================="
          echo "Archivos encontrados: ${FILE_COUNT}"
          echo "=========================================="

          cat download_list.txt

      - name: Build TeraBox destination directory
        shell: bash
        run: |
          set -euxo pipefail

          URL="${{ inputs.download_url }}"

          # Extraer solamente el path.
          URL_PATH="$(
            printf '%s' "${URL}" |
            sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://[^/]+##'
          )"

          URL_PATH="${URL_PATH%%\?*}"
          URL_PATH="${URL_PATH%%\#*}"

          if [[ -z "${URL_PATH}" || "${URL_PATH}" == "/" ]]; then
            echo "::error::No se pudo obtener la ruta de la URL."
            exit 1
          fi

          # Eliminar / final.
          URL_PATH="${URL_PATH%/}"

          REMOTE_DIR="/Archive${URL_PATH}"

          echo "URL:"
          echo "${URL}"

          echo "URL path:"
          echo "${URL_PATH}"

          echo "Directorio TeraBox:"
          echo "${REMOTE_DIR}"

          echo "REMOTE_DIR=${REMOTE_DIR}" >> "$GITHUB_ENV"

      - name: Download all files with aria2
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p downloaded

          echo "Descargando todos los archivos..."

          aria2c \
            -x 16 \
            -s 16 \
            -j 4 \
            --continue=true \
            --auto-file-renaming=false \
            --allow-overwrite=true \
            --console-log-level=notice \
            --dir=downloaded \
            --input-file=download_list.txt

          echo "=========================================="
          echo "Descargas completadas."
          echo "=========================================="

          find downloaded -type f -print

      - name: Upload all files to TeraBox
        shell: bash
        run: |
          set -euxo pipefail

          UPLOAD_HOST="https://c-jp.terabox.com"
          MAX_PARALLEL=4

          upload_file() {
            local FILE="$1"

            local FILE_NAME
            FILE_NAME="$(basename "${FILE}")"

            local REMOTE_PATH="${REMOTE_DIR}/${FILE_NAME}"

            echo ""
            echo "=========================================================="
            echo "Procesando archivo"
            echo "=========================================================="
            echo "Local : ${FILE}"
            echo "Remoto: ${REMOTE_PATH}"
            echo "=========================================================="

            local FILE_SIZE
            FILE_SIZE="$(stat -c '%s' "${FILE}")"

            local CHUNK_DIR
            CHUNK_DIR="$(mktemp -d)"

            local CHUNK_SIZE=$((20 * 1024 * 1024))

            split \
              -b "${CHUNK_SIZE}" \
              -d \
              -a 6 \
              "${FILE}" \
              "${CHUNK_DIR}/part_"

            local BLOCK_LIST="["
            local FIRST=1
            local PARTSEQ=0

            for PART in "${CHUNK_DIR}"/part_*; do

              local MD5
              MD5="$(md5sum "${PART}" | awk '{print $1}')"

              if [[ "${FIRST}" -eq 1 ]]; then
                FIRST=0
              else
                BLOCK_LIST+=","
              fi

              BLOCK_LIST+="\"${MD5}\""

              PARTSEQ=$((PARTSEQ + 1))
            done

            BLOCK_LIST+="]"

            echo "Tamaño: ${FILE_SIZE}"
            echo "Chunks: ${PARTSEQ}"
            echo "Block list: ${BLOCK_LIST}"

            # ------------------------------------------------------
            # PRECREATE
            # ------------------------------------------------------

            echo "Ejecutando precreate..."

            local RESPONSE

            RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --cookie "${TERABOX_COOKIE}" \
                --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                --header "Origin: https://www.terabox.com" \
                --header "Referer: https://www.terabox.com/main" \
                --header "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "path=${REMOTE_PATH}" \
                --data-urlencode "size=${FILE_SIZE}" \
                --data-urlencode "isdir=0" \
                --data-urlencode "autoinit=1" \
                --data-urlencode "target_path=${REMOTE_DIR}/" \
                --data-urlencode "block_list=${BLOCK_LIST}" \
                --data-urlencode "jsToken=${TERABOX_JSTOKEN}" \
                --data-urlencode "app_id=250528" \
                --data-urlencode "web=1" \
                --data-urlencode "channel=dubox" \
                --data-urlencode "clienttype=0" \
                "https://www.terabox.com/api/precreate"
            )"

            echo "Precreate response:"
            echo "${RESPONSE}"

            local ERRNO
            ERRNO="$(echo "${RESPONSE}" | jq -r '.errno // -999')"

            if [[ "${ERRNO}" != "0" ]]; then
              echo "::error::Precreate falló para ${FILE_NAME}"
              rm -rf "${CHUNK_DIR}"
              return 1
            fi

            local UPLOAD_ID
            UPLOAD_ID="$(echo "${RESPONSE}" | jq -r '.uploadid // empty')"

            if [[ -z "${UPLOAD_ID}" ]]; then

              local RETURN_TYPE
              RETURN_TYPE="$(echo "${RESPONSE}" | jq -r '.return_type // empty')"

              if [[ "${RETURN_TYPE}" == "2" ]]; then
                echo "El archivo ya existe en TeraBox:"
                echo "${REMOTE_PATH}"

                rm -rf "${CHUNK_DIR}"
                return 0
              fi

              echo "::error::No se recibió uploadid para ${FILE_NAME}"

              rm -rf "${CHUNK_DIR}"
              return 1
            fi

            echo "Upload ID: ${UPLOAD_ID}"

            # ------------------------------------------------------
            # UPLOAD CHUNKS
            # ------------------------------------------------------

            upload_chunk() {
              local PART="$1"
              local SEQ="$2"

              echo "[$FILE_NAME] Subiendo chunk ${SEQ}"

              local UPLOAD_RESPONSE

              UPLOAD_RESPONSE="$(
                curl \
                  --silent \
                  --show-error \
                  --fail-with-body \
                  --request POST \
                  --cookie "${TERABOX_COOKIE}" \
                  --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                  --header "Origin: https://www.terabox.com" \
                  --header "Referer: https://www.terabox.com/main" \
                  --form "file=@${PART}" \
                  "${UPLOAD_HOST}/rest/2.0/pcs/superfile2?method=upload&type=tmpfile&app_id=250528&path=$(printf '%s' "${REMOTE_PATH}" | jq -sRr @uri)&uploadid=${UPLOAD_ID}&partseq=${SEQ}"
              )"

              echo "[$FILE_NAME] Chunk ${SEQ}: ${UPLOAD_RESPONSE}"

              local ERROR_CODE
              ERROR_CODE="$(echo "${UPLOAD_RESPONSE}" | jq -r '.error_code // 0')"

              if [[ "${ERROR_CODE}" != "0" ]]; then
                echo "::error::Falló el chunk ${SEQ} de ${FILE_NAME}"
                return 1
              fi
            }

            local ACTIVE=0
            local SEQ=0
            local PIDS=()

            for PART in "${CHUNK_DIR}"/part_*; do

              upload_chunk "${PART}" "${SEQ}" &

              PIDS+=("$!")
              ACTIVE=$((ACTIVE + 1))
              SEQ=$((SEQ + 1))

              if [[ "${ACTIVE}" -ge "${MAX_PARALLEL}" ]]; then

                for PID in "${PIDS[@]}"; do
                  wait "${PID}"
                done

                PIDS=()
                ACTIVE=0

              fi

            done

            for PID in "${PIDS[@]}"; do
              wait "${PID}"
            done

            echo "Todos los chunks de ${FILE_NAME} fueron subidos."

            # ------------------------------------------------------
            # CREATE
            # ------------------------------------------------------

            echo "Finalizando ${FILE_NAME}..."

            RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --cookie "${TERABOX_COOKIE}" \
                --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                --header "Origin: https://www.terabox.com" \
                --header "Referer: https://www.terabox.com/main" \
                --header "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "path=${REMOTE_PATH}" \
                --data-urlencode "uploadid=${UPLOAD_ID}" \
                --data-urlencode "target_path=${REMOTE_DIR}/" \
                --data-urlencode "size=${FILE_SIZE}" \
                --data-urlencode "block_list=${BLOCK_LIST}" \
                --data-urlencode "rtype=1" \
                --data-urlencode "isdir=0" \
                --data-urlencode "app_id=250528" \
                --data-urlencode "web=1" \
                --data-urlencode "channel=dubox" \
                --data-urlencode "clienttype=0" \
                "https://www.terabox.com/api/create"
            )"

            echo "Create response:"
            echo "${RESPONSE}"

            ERRNO="$(echo "${RESPONSE}" | jq -r '.errno // -999')"

            if [[ "${ERRNO}" != "0" ]]; then
              echo "::error::Create falló para ${FILE_NAME}"
              rm -rf "${CHUNK_DIR}"
              return 1
            fi

            echo ""
            echo "=========================================================="
            echo "UPLOAD COMPLETADO"
            echo "=========================================================="
            echo "Archivo : ${FILE_NAME}"
            echo "Destino : ${REMOTE_PATH}"
            echo "Tamaño  : ${FILE_SIZE} bytes"
            echo "=========================================================="

            rm -rf "${CHUNK_DIR}"
          }

          export -f upload_file

          # --------------------------------------------------------
          # Subir archivos.
          # --------------------------------------------------------

          find downloaded \
            -maxdepth 1 \
            -type f \
            -print0 |
          while IFS= read -r -d '' FILE; do
            upload_file "${FILE}" || exit 1
          done

      - name: Show result
        shell: bash
        run: |
          set -euxo pipefail

          echo ""
          echo "=========================================================="
          echo "      PREMIUM UPLOAD COMPLETED SUCCESSFULLY"
          echo "=========================================================="
          echo ""
          echo "Origen:"
          echo "${{ inputs.download_url }}"
          echo ""
          echo "Destino:"
          echo "${REMOTE_DIR}"
          echo ""
          echo "Archivos:"
          find downloaded -maxdepth 1 -type f -printf '  - %f\n'
          echo ""
          echo "=========================================================="
