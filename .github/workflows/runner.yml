name: Download and Upload to TeraBox Premium

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "URL HTTP/HTTPS del archivo que se desea descargar"
        required: true
        type: string

jobs:
  upload-to-terabox:
    name: Official TeraBox Open Platform Upload
    runs-on: ubuntu-latest

    env:
      TERABOX_ACCESS_TOKEN: ${{ secrets.TERABOX_ACCESS_TOKEN }}

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update -y
          sudo apt-get install -y aria2 jq curl

          aria2c --version
          curl --version
          jq --version

      - name: Check inputs
        shell: bash
        run: |
          set -euxo pipefail

          if [[ -z "${TERABOX_ACCESS_TOKEN}" ]]; then
            echo "::error::El secret TERABOX_ACCESS_TOKEN no está configurado."
            exit 1
          fi

          if [[ -z "${{ inputs.download_url }}" ]]; then
            echo "::error::No se proporcionó una URL de descarga."
            exit 1
          fi

      - name: Download file with aria2
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p downloaded

          URL="${{ inputs.download_url }}"

          FILE_NAME="$(basename "${URL%%\?*}")"

          if [[ -z "${FILE_NAME}" || "${FILE_NAME}" == "/" || "${FILE_NAME}" == "." ]]; then
            echo "::error::No se pudo determinar el nombre del archivo."
            exit 1
          fi

          echo "URL: ${URL}"
          echo "Archivo: ${FILE_NAME}"

          aria2c \
            -x 16 \
            -s 16 \
            --console-log-level=notice \
            --dir=downloaded \
            --out="${FILE_NAME}" \
            "${URL}"

          echo "DOWNLOADED_FILE=downloaded/${FILE_NAME}" >> "$GITHUB_ENV"

      - name: Get TeraBox API domains
        shell: bash
        run: |
          set -euxo pipefail

          echo "Obteniendo información del access_token..."

          TOKEN_INFO="$(
            curl --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --form "access_token=${TERABOX_ACCESS_TOKEN}" \
              "https://www.terabox.com/oauth/tokeninfo"
          )"

          echo "Token information received."

          ERRNO="$(echo "${TOKEN_INFO}" | jq -r '.errno // -1')"

          if [[ "${ERRNO}" != "0" ]]; then
            echo "::error::TeraBox rechazó el access_token."
            echo "${TOKEN_INFO}"
            exit 1
          fi

          API_DOMAIN="$(echo "${TOKEN_INFO}" | jq -r '.data.api_domain')"
          UPLOAD_DOMAIN="$(echo "${TOKEN_INFO}" | jq -r '.data.upload_domain')"
          CLIENT_ID="$(echo "${TOKEN_INFO}" | jq -r '.data.client_id')"

          if [[ -z "${API_DOMAIN}" || "${API_DOMAIN}" == "null" ]]; then
            echo "::error::TeraBox no devolvió api_domain."
            exit 1
          fi

          if [[ -z "${UPLOAD_DOMAIN}" || "${UPLOAD_DOMAIN}" == "null" ]]; then
            echo "::error::TeraBox no devolvió upload_domain."
            exit 1
          fi

          echo "API domain: ${API_DOMAIN}"
          echo "Upload domain: ${UPLOAD_DOMAIN}"
          echo "Client ID: ${CLIENT_ID}"

          echo "TERABOX_API_DOMAIN=${API_DOMAIN}" >> "$GITHUB_ENV"
          echo "TERABOX_UPLOAD_DOMAIN=${UPLOAD_DOMAIN}" >> "$GITHUB_ENV"
          echo "TERABOX_CLIENT_ID=${CLIENT_ID}" >> "$GITHUB_ENV"

      - name: Build TeraBox destination path
        shell: bash
        run: |
          set -euxo pipefail

          FILE_NAME="$(basename "${DOWNLOADED_FILE}")"

          # La Open Platform de TeraBox asigna los archivos
          # a un espacio propio de la aplicación.
          #
          # Cambia "TeraBox GitHub Actions" por el nombre
          # de tu aplicación registrada en TeraBox.
          APP_NAME="TeraBox GitHub Actions"

          REMOTE_DIR="/From: Other Applications/${APP_NAME}-"
          REMOTE_PATH="${REMOTE_DIR}/${FILE_NAME}"

          echo "Aplicación: ${APP_NAME}"
          echo "Directorio remoto: ${REMOTE_DIR}"
          echo "Archivo remoto: ${REMOTE_PATH}"

          echo "REMOTE_DIR=${REMOTE_DIR}" >> "$GITHUB_ENV"
          echo "REMOTE_PATH=${REMOTE_PATH}" >> "$GITHUB_ENV"

      - name: Calculate file information
        shell: bash
        run: |
          set -euxo pipefail

          FILE_SIZE="$(stat -c '%s' "${DOWNLOADED_FILE}")"

          echo "Archivo: ${DOWNLOADED_FILE}"
          echo "Tamaño: ${FILE_SIZE} bytes"

          # TeraBox requiere MD5 por shard.
          # Usamos shards de 20 MiB.
          CHUNK_SIZE=$((20 * 1024 * 1024))

          mkdir -p chunks

          split \
            -b "${CHUNK_SIZE}" \
            -d \
            -a 6 \
            "${DOWNLOADED_FILE}" \
            chunks/part_

          BLOCK_LIST="["

          FIRST=1

          for PART in chunks/part_*; do
            MD5="$(md5sum "${PART}" | awk '{print $1}')"

            if [[ "${FIRST}" -eq 1 ]]; then
              FIRST=0
            else
              BLOCK_LIST+=","
            fi

            BLOCK_LIST+="\"${MD5}\""

            echo "Shard: ${PART}"
            echo "MD5:   ${MD5}"
          done

          BLOCK_LIST+="]"

          echo "BLOCK_LIST=${BLOCK_LIST}" >> "$GITHUB_ENV"
          echo "FILE_SIZE=${FILE_SIZE}" >> "$GITHUB_ENV"

          echo "Block list:"
          echo "${BLOCK_LIST}"

      - name: TeraBox pre-create
        shell: bash
        run: |
          set -euxo pipefail

          echo "Solicitando upload ID..."

          PRECREATE_RESPONSE="$(
            curl --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --data-urlencode "path=${REMOTE_PATH}" \
              --data-urlencode "size=${FILE_SIZE}" \
              --data-urlencode "isdir=0" \
              --data-urlencode "autoinit=1" \
              --data-urlencode "block_list=${BLOCK_LIST}" \
              "${TERABOX_API_DOMAIN}/openapi/api/precreate?access_tokens=${TERABOX_ACCESS_TOKEN}"
          )"

          echo "Pre-create response:"
          echo "${PRECREATE_RESPONSE}"

          ERRNO="$(echo "${PRECREATE_RESPONSE}" | jq -r '.errno // -1')"

          if [[ "${ERRNO}" != "0" ]]; then
            echo "::error::TeraBox pre-create falló."
            exit 1
          fi

          RETURN_TYPE="$(echo "${PRECREATE_RESPONSE}" | jq -r '.return_type // 1')"

          if [[ "${RETURN_TYPE}" == "2" ]]; then
            echo "El archivo ya existe en TeraBox."
            exit 0
          fi

          UPLOAD_ID="$(echo "${PRECREATE_RESPONSE}" | jq -r '.uploadid')"

          if [[ -z "${UPLOAD_ID}" || "${UPLOAD_ID}" == "null" ]]; then
            echo "::error::TeraBox no devolvió uploadid."
            exit 1
          fi

          echo "UPLOAD_ID=${UPLOAD_ID}" >> "$GITHUB_ENV"

      - name: Upload shards to TeraBox
        shell: bash
        run: |
          set -euxo pipefail

          INDEX=0

          for PART in chunks/part_*; do
            echo "=========================================================="
            echo "Subiendo shard ${INDEX}"
            echo "Archivo: ${PART}"
            echo "=========================================================="

            RESPONSE="$(
              curl --fail-with-body \
                --silent \
                --show-error \
                --request POST \
                --form "file=@${PART}" \
                "${TERABOX_UPLOAD_DOMAIN}/rest/2.0/pcs/superfile2?method=upload&app_id=250528&path=${REMOTE_PATH}&uploadid=${UPLOAD_ID}&partseq=${INDEX}&access_tokens=${TERABOX_ACCESS_TOKEN}"
            )"

            echo "Upload response:"
            echo "${RESPONSE}"

            ERROR_CODE="$(echo "${RESPONSE}" | jq -r '.error_code // 0')"

            if [[ "${ERROR_CODE}" != "0" ]]; then
              echo "::error::Falló el upload del shard ${INDEX}."
              exit 1
            fi

            INDEX=$((INDEX + 1))
          done

      - name: Create file in TeraBox
        shell: bash
        run: |
          set -euxo pipefail

          echo "Finalizando archivo..."

          CREATE_RESPONSE="$(
            curl --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --data-urlencode "path=${REMOTE_PATH}" \
              --data-urlencode "size=${FILE_SIZE}" \
              --data-urlencode "uploadid=${UPLOAD_ID}" \
              --data-urlencode "block_list=${BLOCK_LIST}" \
              --data-urlencode "rtype=1" \
              "${TERABOX_API_DOMAIN}/openapi/api/create?access_tokens=${TERABOX_ACCESS_TOKEN}"
          )"

          echo "Create response:"
          echo "${CREATE_RESPONSE}"

          ERRNO="$(echo "${CREATE_RESPONSE}" | jq -r '.errno // -1')"

          if [[ "${ERRNO}" != "0" ]]; then
            echo "::error::TeraBox no pudo crear/finalizar el archivo."
            exit 1
          fi

          echo "=========================================================="
          echo "¡SUBIDA COMPLETADA CON ÉXITO!"
          echo "=========================================================="
          echo "Archivo local : ${DOWNLOADED_FILE}"
          echo "Archivo remoto: ${REMOTE_PATH}"
          echo "Tamaño        : ${FILE_SIZE} bytes"
          echo "=========================================================="
