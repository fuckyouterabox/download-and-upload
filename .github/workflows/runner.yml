```yaml
name: Download and Upload to TeraBox Premium

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "URL HTTP/HTTPS de un archivo o carpeta h5ai"
        required: true
        type: string

jobs:
  upload-to-terabox:
    name: Premium Parallel Download and Upload
    runs-on: ubuntu-latest

    env:
      TERABOX_JSTOKEN: ${{ secrets.TERABOX_JSTOKEN }}
      TERABOX_COOKIE: ${{ secrets.TERABOX_COOKIE }}

    steps:

      # ==========================================================
      # DEPENDENCIAS
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update -y
          sudo apt-get install -y aria2 curl jq python3

          aria2c --version
          curl --version
          jq --version
          python3 --version

      # ==========================================================
      # VALIDACIÓN
      # ==========================================================

      - name: Check inputs and environment
        shell: bash
        env:
          INPUT_URL: ${{ inputs.download_url }}
        run: |
          set -euo pipefail

          if [[ -z "${TERABOX_COOKIE}" ]]; then
            echo "::error::El secret TERABOX_COOKIE no está configurado."
            exit 1
          fi

          if [[ -z "${TERABOX_JSTOKEN}" ]]; then
            echo "::error::El secret TERABOX_JSTOKEN no está configurado."
            exit 1
          fi

          if [[ -z "${INPUT_URL}" ]]; then
            echo "::error::No se proporcionó una URL."
            exit 1
          fi

      # ==========================================================
      # DESCUBRIR ARCHIVOS
      # ==========================================================

      - name: Discover files from h5ai
        shell: bash
        env:
          INPUT_URL: ${{ inputs.download_url }}
        run: |
          set -euo pipefail

          mkdir -p downloaded

          python3 <<'PY'
          import os
          import ssl
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse, unquote
          from urllib.request import Request, urlopen

          INPUT_URL = os.environ["INPUT_URL"]

          USER_AGENT = (
              "Mozilla/5.0 "
              "(X11; Linux x86_64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/151.0 Safari/537.36"
          )

          context = ssl.create_default_context()


          class H5AIParser(HTMLParser):
              def __init__(self):
                  super().__init__()

                  self.current_li_classes = set()
                  self.current_anchor_href = None
                  self.current_anchor_text = []

                  self.in_fb_name = False

                  self.files = []
                  self.folders = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  # ------------------------------------------------
                  # h5ai moderno:
                  #
                  # <li class="item file">
                  # <a href="...">
                  #
                  # <li class="item folder">
                  # <a href="...">
                  # ------------------------------------------------

                  if tag == "li":
                      classes = set(
                          attrs.get("class", "").split()
                      )

                      if "item" in classes:
                          self.current_li_classes = classes
                      else:
                          self.current_li_classes = set()

                  elif tag == "a":
                      href = attrs.get("href")

                      if not href:
                          return

                      if self.current_li_classes:
                          self.current_anchor_href = href
                          self.current_anchor_text = []

                      # ------------------------------------------------
                      # h5ai fallback:
                      #
                      # <td class="fb-n">
                      #   <a href="...">
                      # ------------------------------------------------

                      if self.in_fb_name:
                          self.current_anchor_href = href
                          self.current_anchor_text = []

                  elif tag == "td":
                      classes = set(
                          attrs.get("class", "").split()
                      )

                      if "fb-n" in classes:
                          self.in_fb_name = True

              def handle_data(self, data):
                  if self.current_anchor_href is not None:
                      self.current_anchor_text.append(data)

              def handle_endtag(self, tag):
                  if tag == "td" and self.in_fb_name:
                      self.in_fb_name = False

                  elif tag == "a":
                      href = self.current_anchor_href

                      if href:
                          href = href.strip()

                          # Ignorar:
                          #   ..
                          #   .
                          #   javascript:
                          #   #anchors
                          #   recursos h5ai
                          if href in ("..", ".", ""):
                              self.current_anchor_href = None
                              self.current_anchor_text = []
                              return

                          if href.startswith("#"):
                              self.current_anchor_href = None
                              self.current_anchor_text = []
                              return

                          if href.lower().startswith("javascript:"):
                              self.current_anchor_href = None
                              self.current_anchor_text = []
                              return

                          classes = self.current_li_classes

                          if "file" in classes:
                              self.files.append(href)

                          elif "folder" in classes:
                              self.folders.append(href)

                          else:
                              # Fallback de h5ai:
                              #
                              # href terminado en / = carpeta
                              # cualquier otro = archivo
                              if href.endswith("/"):
                                  self.folders.append(href)
                              else:
                                  self.files.append(href)

                      self.current_anchor_href = None
                      self.current_anchor_text = []

                  elif tag == "li":
                      self.current_li_classes = set()


          visited_directories = set()
          discovered_files = {}


          def fetch(url):
              print()
              print("=" * 80)
              print("GET")
              print(url)
              print("=" * 80)

              req = Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "text/html,application/xhtml+xml"
                  }
              )

              with urlopen(req, context=context, timeout=60) as response:
                  content_type = response.headers.get(
                      "Content-Type",
                      ""
                  )

                  body = response.read()

              return content_type, body


          def clean_url(url):
              parsed = urlparse(url)

              # No descargar recursos que pertenezcan a h5ai.
              if "/_h5ai/" in parsed.path:
                  return None

              if parsed.scheme not in ("http", "https"):
                  return None

              return url


          def filename_from_url(url):
              path = urlparse(url).path.rstrip("/")

              if not path:
                  return None

              return unquote(path.split("/")[-1])


          def crawl(directory_url, relative_prefix=""):
              directory_url = directory_url.rstrip("/") + "/"

              if directory_url in visited_directories:
                  return

              visited_directories.add(directory_url)

              try:
                  content_type, body = fetch(directory_url)
              except Exception as e:
                  print(
                      f"ERROR accediendo a {directory_url}: {e}"
                  )
                  return

              # ------------------------------------------------------
              # Si la URL no devuelve HTML, es un archivo.
              # ------------------------------------------------------

              body_start = body[:500].lstrip().lower()

              looks_like_html = (
                  "html" in content_type.lower()
                  or body_start.startswith(b"<!doctype html")
                  or body_start.startswith(b"<html")
                  or b"<body" in body_start
              )

              if not looks_like_html:
                  filename = filename_from_url(directory_url)

                  if filename:
                      relative_path = (
                          f"{relative_prefix}{filename}"
                      )

                      discovered_files[relative_path] = directory_url

                  return

              try:
                  html = body.decode(
                      "utf-8",
                      errors="ignore"
                  )
              except Exception:
                  return

              parser = H5AIParser()
              parser.feed(html)

              # ------------------------------------------------------
              # Archivos
              # ------------------------------------------------------

              for href in parser.files:
                  full_url = urljoin(
                      directory_url,
                      href
                  )

                  full_url = clean_url(full_url)

                  if not full_url:
                      continue

                  filename = filename_from_url(full_url)

                  if not filename:
                      continue

                  relative_path = (
                      f"{relative_prefix}{filename}"
                  )

                  discovered_files[
                      relative_path
                  ] = full_url

              # ------------------------------------------------------
              # Carpetas
              # ------------------------------------------------------

              for href in parser.folders:
                  full_url = urljoin(
                      directory_url,
                      href
                  )

                  full_url = clean_url(full_url)

                  if not full_url:
                      continue

                  # No volver a subir hacia el padre.
                  if href in ("..", "../"):
                      continue

                  folder_name = unquote(
                      urlparse(full_url).path
                      .rstrip("/")
                      .split("/")[-1]
                  )

                  if not folder_name:
                      continue

                  crawl(
                      full_url,
                      f"{relative_prefix}{folder_name}/"
                  )


          parsed = urlparse(INPUT_URL)

          # ----------------------------------------------------------
          # ARCHIVO DIRECTO
          # ----------------------------------------------------------

          if not parsed.path.endswith("/"):
              filename = filename_from_url(INPUT_URL)

              if not filename:
                  raise SystemExit(
                      "No se pudo determinar el nombre del archivo."
                  )

              discovered_files[
                  filename
              ] = INPUT_URL

          # ----------------------------------------------------------
          # CARPETA / ÍNDICE H5AI
          # ----------------------------------------------------------

          else:
              crawl(INPUT_URL)


          if not discovered_files:
              raise SystemExit(
                  "No se encontraron archivos en la URL indicada."
              )


          print()
          print("=" * 80)
          print("ARCHIVOS ENCONTRADOS")
          print("=" * 80)

          with open(
              "files.tsv",
              "w",
              encoding="utf-8"
          ) as out:

              for relative_path, url in sorted(
                  discovered_files.items()
              ):

                  print(
                      f"{relative_path}\t{url}"
                  )

                  out.write(
                      f"{relative_path}\t{url}\n"
                  )

          print()
          print(
              f"Total: {len(discovered_files)} archivos"
          )
          PY

          echo
          echo "=========================================================="
          echo "Contenido de files.tsv"
          echo "=========================================================="

          cat files.tsv

      # ==========================================================
      # PREPARAR LISTA DE ARIA2
      # ==========================================================

      - name: Build aria2 download list
        shell: bash
        run: |
          set -euo pipefail

          rm -f aria2.txt

          while IFS=$'\t' read -r RELATIVE_PATH URL; do

            [[ -z "${RELATIVE_PATH}" ]] && continue

            DIRNAME="$(dirname "${RELATIVE_PATH}")"
            BASENAME="$(basename "${RELATIVE_PATH}")"

            echo "${URL}" >> aria2.txt

            if [[ "${DIRNAME}" != "." ]]; then
              echo "  dir=downloaded/${DIRNAME}" >> aria2.txt
            else
              echo "  dir=downloaded" >> aria2.txt
            fi

            echo "  out=${BASENAME}" >> aria2.txt
            echo >> aria2.txt

          done < files.tsv

          echo "=========================================================="
          echo "aria2.txt"
          echo "=========================================================="

          cat aria2.txt

      # ==========================================================
      # DESCARGAR TODO
      # ==========================================================

      - name: Download files with aria2
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloaded

          aria2c \
            --input-file=aria2.txt \
            --continue=true \
            --allow-overwrite=true \
            --auto-file-renaming=false \
            --max-concurrent-downloads=4 \
            --split=16 \
            --max-connection-per-server=16 \
            --min-split-size=10M \
            --console-log-level=notice

          echo
          echo "=========================================================="
          echo "ARCHIVOS DESCARGADOS"
          echo "=========================================================="

          find downloaded \
            -type f \
            -print

      # ==========================================================
      # CALCULAR DIRECTORIO REMOTO BASE
      # ==========================================================

      - name: Build TeraBox destination
        shell: bash
        env:
          INPUT_URL: ${{ inputs.download_url }}
        run: |
          set -euo pipefail

          URL="${INPUT_URL}"

          URL_PATH="$(
            printf '%s' "${URL}" |
            sed -E \
              's#^[a-zA-Z][a-zA-Z0-9+.-]*://[^/]+##'
          )"

          URL_PATH="${URL_PATH%%\?*}"
          URL_PATH="${URL_PATH%%\#*}"

          # ------------------------------------------------------
          # Si es una carpeta, conservar la carpeta.
          # ------------------------------------------------------

          if [[ "${URL_PATH}" == */ ]]; then
            URL_PATH="${URL_PATH%/}"

          else
            # Si es un archivo, subir al directorio padre.
            URL_PATH="$(dirname "${URL_PATH}")"

          fi

          if [[ -z "${URL_PATH}" || "${URL_PATH}" == "/" ]]; then
            REMOTE_DIR="/Archive"

          else
            REMOTE_DIR="/Archive${URL_PATH}"

          fi

          echo "REMOTE_DIR=${REMOTE_DIR}" >> "$GITHUB_ENV"

          echo "=========================================================="
          echo "TeraBox destination"
          echo "=========================================================="
          echo "${REMOTE_DIR}"

      # ==========================================================
      # CREAR CARPETAS REMOTAS
      # ==========================================================

      - name: Create TeraBox directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p remote_dirs

          # ------------------------------------------------------
          # Obtener todas las carpetas necesarias a partir de
          # files.tsv.
          # ------------------------------------------------------

          while IFS=$'\t' read -r RELATIVE_PATH URL; do

            [[ -z "${RELATIVE_PATH}" ]] && continue

            DIR="$(dirname "${RELATIVE_PATH}")"

            [[ "${DIR}" == "." ]] && continue

            CURRENT=""

            IFS='/' read -ra PARTS <<< "${DIR}"

            for PART in "${PARTS[@]}"; do

              [[ -z "${PART}" ]] && continue

              if [[ -z "${CURRENT}" ]]; then
                CURRENT="${PART}"
              else
                CURRENT="${CURRENT}/${PART}"
              fi

              echo "${REMOTE_DIR}/${CURRENT}" \
                >> remote_dirs

            done

          done < files.tsv

          sort -u remote_dirs -o remote_dirs

          echo "=========================================================="
          echo "Directorios remotos necesarios"
          echo "=========================================================="

          if [[ -s remote_dirs ]]; then
            cat remote_dirs
          else
            echo "No hay subdirectorios."
          fi

          # ------------------------------------------------------
          # Crear uno por uno.
          # ------------------------------------------------------

          if [[ -s remote_dirs ]]; then

            while IFS= read -r DIRECTORY; do

              echo
              echo "Creando: ${DIRECTORY}"

              RESPONSE="$(
                curl \
                  --silent \
                  --show-error \
                  --fail-with-body \
                  --request POST \
                  --cookie "${TERABOX_COOKIE}" \
                  --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                  --header "Origin: https://www.terabox.com" \
                  --header "Referer: https://www.terabox.com/main" \
                  --header "Content-Type: application/x-www-form-urlencoded" \
                  --data-urlencode "path=${DIRECTORY}" \
                  --data-urlencode "isdir=1" \
                  --data-urlencode 'block_list=[]' \
                  --data-urlencode "jsToken=${TERABOX_JSTOKEN}" \
                  --data-urlencode "app_id=250528" \
                  --data-urlencode "web=1" \
                  --data-urlencode "channel=dubox" \
                  --data-urlencode "clienttype=0" \
                  "https://www.terabox.com/api/create"
              )"

              echo "${RESPONSE}"

              ERRNO="$(
                echo "${RESPONSE}" |
                jq -r '.errno // -999'
              )"

              # 0 = creada correctamente.
              #
              # Algunos clientes devuelven un error/conflicto
              # si la carpeta ya existe. En ese caso continuamos.
              if [[ "${ERRNO}" != "0" ]]; then
                echo "Aviso: la carpeta puede ya existir."
              fi

            done < remote_dirs

          fi

      # ==========================================================
      # SUBIR UN ARCHIVO
      # ==========================================================

      - name: Upload files to TeraBox
        shell: bash
        run: |
          set -euo pipefail

          UPLOAD_HOST="https://c-jp.terabox.com"
          MAX_PARALLEL=8

          upload_file() {

            local FILE="$1"
            local RELATIVE_PATH="$2"

            local FILE_NAME
            FILE_NAME="$(basename "${FILE}")"

            local REMOTE_PATH
            REMOTE_PATH="${REMOTE_DIR}/${RELATIVE_PATH}"

            local TARGET_PATH
            TARGET_PATH="$(dirname "${REMOTE_PATH}")"

            echo
            echo "=========================================================="
            echo "SUBIENDO ARCHIVO"
            echo "=========================================================="
            echo "Local:"
            echo "${FILE}"
            echo
            echo "Remoto:"
            echo "${REMOTE_PATH}"
            echo
            echo "Directorio:"
            echo "${TARGET_PATH}"
            echo "=========================================================="

            local FILE_SIZE
            FILE_SIZE="$(stat -c '%s' "${FILE}")"

            local CHUNK_DIR
            CHUNK_DIR="$(mktemp -d)"

            local CHUNK_SIZE=$((20 * 1024 * 1024))

            split \
              -b "${CHUNK_SIZE}" \
              -d \
              -a 6 \
              "${FILE}" \
              "${CHUNK_DIR}/part_"

            local BLOCK_LIST="["
            local FIRST=1
            local PARTSEQ=0

            for PART in "${CHUNK_DIR}"/part_*; do

              local MD5
              MD5="$(md5sum "${PART}" | awk '{print $1}')"

              if [[ "${FIRST}" -eq 1 ]]; then
                FIRST=0
              else
                BLOCK_LIST+=","
              fi

              BLOCK_LIST+="\"${MD5}\""

              PARTSEQ=$((PARTSEQ + 1))

            done

            BLOCK_LIST+="]"

            echo "Tamaño : ${FILE_SIZE}"
            echo "Chunks : ${PARTSEQ}"

            # ------------------------------------------------------
            # PRECREATE
            # ------------------------------------------------------

            local RESPONSE

            RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --cookie "${TERABOX_COOKIE}" \
                --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                --header "Origin: https://www.terabox.com" \
                --header "Referer: https://www.terabox.com/main" \
                --header "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "path=${REMOTE_PATH}" \
                --data-urlencode "size=${FILE_SIZE}" \
                --data-urlencode "isdir=0" \
                --data-urlencode "autoinit=1" \
                --data-urlencode "target_path=${TARGET_PATH}/" \
                --data-urlencode "block_list=${BLOCK_LIST}" \
                --data-urlencode "jsToken=${TERABOX_JSTOKEN}" \
                --data-urlencode "app_id=250528" \
                --data-urlencode "web=1" \
                --data-urlencode "channel=dubox" \
                --data-urlencode "clienttype=0" \
                "https://www.terabox.com/api/precreate"
            )"

            echo "Precreate:"
            echo "${RESPONSE}"

            local ERRNO
            ERRNO="$(
              echo "${RESPONSE}" |
              jq -r '.errno // -999'
            )"

            if [[ "${ERRNO}" != "0" ]]; then
              echo "::error::Precreate falló para ${FILE_NAME}"
              rm -rf "${CHUNK_DIR}"
              return 1
            fi

            local UPLOAD_ID
            UPLOAD_ID="$(
              echo "${RESPONSE}" |
              jq -r '.uploadid // empty'
            )"

            if [[ -z "${UPLOAD_ID}" ]]; then

              local RETURN_TYPE
              RETURN_TYPE="$(
                echo "${RESPONSE}" |
                jq -r '.return_type // empty'
              )"

              if [[ "${RETURN_TYPE}" == "2" ]]; then
                echo "El archivo ya existe:"
                echo "${REMOTE_PATH}"

                rm -rf "${CHUNK_DIR}"
                return 0
              fi

              echo "::error::No se recibió uploadid."
              rm -rf "${CHUNK_DIR}"
              return 1
            fi

            # ------------------------------------------------------
            # CHUNK UPLOAD
            # ------------------------------------------------------

            upload_chunk() {

              local PART="$1"
              local SEQ="$2"

              echo "[${FILE_NAME}] chunk ${SEQ}"

              local UPLOAD_RESPONSE

              UPLOAD_RESPONSE="$(
                curl \
                  --silent \
                  --show-error \
                  --fail-with-body \
                  --request POST \
                  --cookie "${TERABOX_COOKIE}" \
                  --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                  --header "Origin: https://www.terabox.com" \
                  --header "Referer: https://www.terabox.com/main" \
                  --form "file=@${PART}" \
                  "${UPLOAD_HOST}/rest/2.0/pcs/superfile2?method=upload&type=tmpfile&app_id=250528&path=$(printf '%s' "${REMOTE_PATH}" | jq -sRr @uri)&uploadid=${UPLOAD_ID}&partseq=${SEQ}"
              )"

              local ERROR_CODE
              ERROR_CODE="$(
                echo "${UPLOAD_RESPONSE}" |
                jq -r '.error_code // 0'
              )"

              if [[ "${ERROR_CODE}" != "0" ]]; then
                echo "::error::Falló el chunk ${SEQ}"
                echo "${UPLOAD_RESPONSE}"
                return 1
              fi
            }

            local ACTIVE=0
            local SEQ=0
            local PIDS=()

            for PART in "${CHUNK_DIR}"/part_*; do

              upload_chunk "${PART}" "${SEQ}" &

              PIDS+=("$!")

              ACTIVE=$((ACTIVE + 1))
              SEQ=$((SEQ + 1))

              if [[ "${ACTIVE}" -ge "${MAX_PARALLEL}" ]]; then

                for PID in "${PIDS[@]}"; do
                  wait "${PID}"
                done

                PIDS=()
                ACTIVE=0

              fi

            done

            for PID in "${PIDS[@]}"; do
              wait "${PID}"
            done

            # ------------------------------------------------------
            # CREATE
            # ------------------------------------------------------

            echo "Finalizando ${FILE_NAME}..."

            RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --cookie "${TERABOX_COOKIE}" \
                --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                --header "Origin: https://www.terabox.com" \
                --header "Referer: https://www.terabox.com/main" \
                --header "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "path=${REMOTE_PATH}" \
                --data-urlencode "uploadid=${UPLOAD_ID}" \
                --data-urlencode "target_path=${TARGET_PATH}/" \
                --data-urlencode "size=${FILE_SIZE}" \
                --data-urlencode "block_list=${BLOCK_LIST}" \
                --data-urlencode "rtype=1" \
                --data-urlencode "isdir=0" \
                --data-urlencode "app_id=250528" \
                --data-urlencode "web=1" \
                --data-urlencode "channel=dubox" \
                --data-urlencode "clienttype=0" \
                "https://www.terabox.com/api/create"
            )"

            echo "Create:"
            echo "${RESPONSE}"

            ERRNO="$(
              echo "${RESPONSE}" |
              jq -r '.errno // -999'
            )"

            if [[ "${ERRNO}" != "0" ]]; then
              echo "::error::Create falló para ${FILE_NAME}"
              rm -rf "${CHUNK_DIR}"
              return 1
            fi

            echo
            echo "OK: ${REMOTE_PATH}"

            rm -rf "${CHUNK_DIR}"
          }


          # --------------------------------------------------------
          # Procesar files.tsv
          # --------------------------------------------------------

          while IFS=$'\t' read -r RELATIVE_PATH URL; do

            [[ -z "${RELATIVE_PATH}" ]] && continue

            FILE="downloaded/${RELATIVE_PATH}"

            if [[ ! -f "${FILE}" ]]; then
              echo "::error::No existe el archivo descargado: ${FILE}"
              exit 1
            fi

            upload_file \
              "${FILE}" \
              "${RELATIVE_PATH}"

          done < files.tsv

      # ==========================================================
      # RESULTADO
      # ==========================================================

      - name: Show result
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================================="
          echo "UPLOAD COMPLETADO"
          echo "=========================================================="
          echo
          echo "Origen:"
          echo "${{ inputs.download_url }}"
          echo
          echo "Destino:"
          echo "${REMOTE_DIR}"
          echo
          echo "Archivos:"
          find downloaded \
            -type f \
            -printf '  - %P\n'
          echo
          echo "=========================================================="
```
