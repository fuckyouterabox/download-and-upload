name: Download and Upload to TeraBox Premium

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "URL HTTP/HTTPS de un archivo o carpeta h5ai"
        required: true
        type: string

jobs:
  upload-to-terabox:
    name: Premium Parallel Download and Upload
    runs-on: ubuntu-latest

    env:
      TERABOX_JSTOKEN: ${{ secrets.TERABOX_JSTOKEN }}
      TERABOX_COOKIE: ${{ secrets.TERABOX_COOKIE }}

    steps:

      # ==========================================================
      # DEPENDENCIAS
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y aria2 curl jq python3

          aria2c --version
          curl --version
          jq --version
          python3 --version

      # ==========================================================
      # VALIDACIÓN
      # ==========================================================

      - name: Check inputs and environment
        shell: bash
        env:
          INPUT_URL: ${{ inputs.download_url }}
        run: |
          set -euo pipefail

          if [[ -z "${TERABOX_COOKIE}" ]]; then
            echo "::error::El secret TERABOX_COOKIE no está configurado."
            exit 1
          fi

          if [[ -z "${TERABOX_JSTOKEN}" ]]; then
            echo "::error::El secret TERABOX_JSTOKEN no está configurado."
            exit 1
          fi

          if [[ -z "${INPUT_URL}" ]]; then
            echo "::error::No se proporcionó una URL."
            exit 1
          fi

      # ==========================================================
      # DESCUBRIR ARCHIVOS DE H5AI
      # ==========================================================

      - name: Discover files from h5ai
        shell: bash
        env:
          INPUT_URL: ${{ inputs.download_url }}
        run: |
          set -euo pipefail

          rm -rf downloaded
          mkdir -p downloaded

          python3 <<'PY'
          import os
          import ssl
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse, unquote
          from urllib.request import Request, urlopen

          INPUT_URL = os.environ["INPUT_URL"]

          USER_AGENT = (
              "Mozilla/5.0 "
              "(X11; Linux x86_64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/151.0 Safari/537.36"
          )

          SSL_CONTEXT = ssl.create_default_context()


          class H5AIParser(HTMLParser):

              def __init__(self):
                  super().__init__()

                  self.current_li_classes = set()
                  self.current_href = None
                  self.in_fb_name = False

                  self.files = []
                  self.folders = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if tag == "li":

                      classes = set(
                          attrs.get("class", "").split()
                      )

                      if "item" in classes:
                          self.current_li_classes = classes
                      else:
                          self.current_li_classes = set()

                  elif tag == "a":

                      href = attrs.get("href")

                      if not href:
                          return

                      if self.current_li_classes:
                          self.current_href = href

                      if self.in_fb_name:
                          self.current_href = href

                  elif tag == "td":

                      classes = set(
                          attrs.get("class", "").split()
                      )

                      if "fb-n" in classes:
                          self.in_fb_name = True

              def handle_endtag(self, tag):

                  if tag == "td":
                      self.in_fb_name = False

                  elif tag == "a":

                      href = self.current_href

                      if href:

                          href = href.strip()

                          if href not in ("", ".", "..", "../"):

                              if href.startswith("#"):
                                  pass

                              elif href.lower().startswith("javascript:"):
                                  pass

                              elif "/_h5ai/" in href:
                                  pass

                              elif "file" in self.current_li_classes:
                                  self.files.append(href)

                              elif "folder" in self.current_li_classes:
                                  self.folders.append(href)

                              else:
                                  # h5ai fallback:
                                  #
                                  # terminado en /
                                  # = carpeta
                                  #
                                  # cualquier otra cosa
                                  # = archivo

                                  if href.endswith("/"):
                                      self.folders.append(href)
                                  else:
                                      self.files.append(href)

                      self.current_href = None

                  elif tag == "li":
                      self.current_li_classes = set()


          visited = set()
          discovered_files = {}


          def fetch(url):

              print()
              print("=" * 80)
              print("GET:", url)
              print("=" * 80)

              request = Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "text/html,application/xhtml+xml"
                  }
              )

              with urlopen(
                  request,
                  context=SSL_CONTEXT,
                  timeout=60
              ) as response:

                  content_type = response.headers.get(
                      "Content-Type",
                      ""
                  )

                  body = response.read()

              return content_type, body


          def is_html(content_type, body):

              if "html" in content_type.lower():
                  return True

              start = body[:1000].lstrip().lower()

              return (
                  start.startswith(b"<!doctype html")
                  or start.startswith(b"<html")
                  or b"<body" in start
              )


          def file_name(url):

              path = urlparse(url).path.rstrip("/")

              if not path:
                  return None

              return unquote(
                  path.split("/")[-1]
              )


          def crawl(directory_url, relative_path=""):

              directory_url = (
                  directory_url.rstrip("/") + "/"
              )

              if directory_url in visited:
                  return

              visited.add(directory_url)

              try:
                  content_type, body = fetch(
                      directory_url
                  )

              except Exception as error:
                  print(
                      f"ERROR accediendo a "
                      f"{directory_url}: {error}"
                  )
                  return

              # --------------------------------------------------
              # Si no devuelve HTML, tratarlo como archivo.
              # --------------------------------------------------

              if not is_html(content_type, body):

                  name = file_name(directory_url)

                  if name:
                      relative_file = (
                          relative_path + name
                      )

                      discovered_files[
                          relative_file
                      ] = directory_url

                  return

              html = body.decode(
                  "utf-8",
                  errors="ignore"
              )

              parser = H5AIParser()
              parser.feed(html)

              # --------------------------------------------------
              # ARCHIVOS
              # --------------------------------------------------

              for href in parser.files:

                  full_url = urljoin(
                      directory_url,
                      href
                  )

                  if "/_h5ai/" in urlparse(
                      full_url
                  ).path:
                      continue

                  name = file_name(full_url)

                  if not name:
                      continue

                  relative_file = (
                      relative_path + name
                  )

                  discovered_files[
                      relative_file
                  ] = full_url

              # --------------------------------------------------
              # CARPETAS
              # --------------------------------------------------

              for href in parser.folders:

                  if href in (
                      ".",
                      "..",
                      "../"
                  ):
                      continue

                  full_url = urljoin(
                      directory_url,
                      href
                  )

                  if "/_h5ai/" in urlparse(
                      full_url
                  ).path:
                      continue

                  parsed_path = urlparse(
                      full_url
                  ).path.rstrip("/")

                  folder_name = unquote(
                      parsed_path.split("/")[-1]
                  )

                  if not folder_name:
                      continue

                  crawl(
                      full_url,
                      relative_path
                      + folder_name
                      + "/"
                  )


          parsed = urlparse(INPUT_URL)

          # ------------------------------------------------------
          # ARCHIVO DIRECTO
          # ------------------------------------------------------

          if not parsed.path.endswith("/"):
              name = file_name(INPUT_URL)

              if not name:
                  raise SystemExit(
                      "No se pudo determinar "
                      "el nombre del archivo."
                  )

              discovered_files[
                  name
              ] = INPUT_URL

          # ------------------------------------------------------
          # CARPETA H5AI
          # ------------------------------------------------------

          else:
              crawl(INPUT_URL)


          if not discovered_files:
              raise SystemExit(
                  "No se encontraron archivos."
              )


          print()
          print("=" * 80)
          print("ARCHIVOS ENCONTRADOS")
          print("=" * 80)

          with open(
              "files.tsv",
              "w",
              encoding="utf-8"
          ) as output:

              for relative_path, url in sorted(
                  discovered_files.items()
              ):

                  print(
                      f"{relative_path}\t{url}"
                  )

                  output.write(
                      f"{relative_path}\t{url}\n"
                  )

          print()
          print(
              "Total de archivos:",
              len(discovered_files)
          )
          PY

          echo
          echo "=========================================================="
          echo "files.tsv"
          echo "=========================================================="

          cat files.tsv

      # ==========================================================
      # CREAR LISTA DE ARIA2
      # ==========================================================

      - name: Build aria2 download list
        shell: bash
        run: |
          set -euo pipefail

          rm -f aria2.txt

          while IFS=$'\t' read -r RELATIVE_PATH URL; do

            [[ -z "${RELATIVE_PATH}" ]] && continue

            DIRECTORY="$(
              dirname "${RELATIVE_PATH}"
            )"

            FILENAME="$(
              basename "${RELATIVE_PATH}"
            )"

            echo "${URL}" >> aria2.txt

            if [[ "${DIRECTORY}" == "." ]]; then
              echo "  dir=downloaded" >> aria2.txt
            else
              echo "  dir=downloaded/${DIRECTORY}" >> aria2.txt
            fi

            echo "  out=${FILENAME}" >> aria2.txt
            echo >> aria2.txt

          done < files.tsv

          echo "=========================================================="
          echo "aria2.txt"
          echo "=========================================================="

          cat aria2.txt

      # ==========================================================
      # DESCARGAR TODOS LOS ARCHIVOS
      # ==========================================================

      - name: Download files with aria2
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloaded

          aria2c \
            --input-file=aria2.txt \
            --continue=true \
            --allow-overwrite=true \
            --auto-file-renaming=false \
            --max-concurrent-downloads=4 \
            --split=16 \
            --max-connection-per-server=16 \
            --min-split-size=10M \
            --console-log-level=notice

          echo
          echo "=========================================================="
          echo "ARCHIVOS DESCARGADOS"
          echo "=========================================================="

          find downloaded \
            -type f \
            -printf '  %P\n'

      # ==========================================================
      # DIRECTORIO REMOTO BASE
      # ==========================================================

      - name: Build TeraBox destination
        shell: bash
        env:
          INPUT_URL: ${{ inputs.download_url }}
        run: |
          set -euo pipefail

          URL="${INPUT_URL}"

          URL_PATH="$(
            printf '%s' "${URL}" |
            sed -E \
              's#^[a-zA-Z][a-zA-Z0-9+.-]*://[^/]+##'
          )"

          URL_PATH="${URL_PATH%%\?*}"
          URL_PATH="${URL_PATH%%\#*}"

          if [[ "${URL_PATH}" == */ ]]; then

            URL_PATH="${URL_PATH%/}"

          else

            URL_PATH="$(
              dirname "${URL_PATH}"
            )"

          fi

          if [[ -z "${URL_PATH}" || "${URL_PATH}" == "/" ]]; then
            REMOTE_DIR="/Archive"
          else
            REMOTE_DIR="/Archive${URL_PATH}"
          fi

          echo "REMOTE_DIR=${REMOTE_DIR}" \
            >> "$GITHUB_ENV"

          echo
          echo "=========================================================="
          echo "DIRECTORIO TERABOX"
          echo "=========================================================="
          echo "${REMOTE_DIR}"

      # ==========================================================
      # CREAR CARPETAS TERABOX
      # ==========================================================

      - name: Create TeraBox directories
        shell: bash
        run: |
          set -euo pipefail

          # IMPORTANTE:
          # remote_dirs.txt es un ARCHIVO.
          # Antes estaba mal definido como directorio.
          rm -f remote_dirs.txt
          touch remote_dirs.txt

          while IFS=$'\t' read -r RELATIVE_PATH URL; do

            [[ -z "${RELATIVE_PATH}" ]] && continue

            DIRECTORY="$(
              dirname "${RELATIVE_PATH}"
            )"

            [[ "${DIRECTORY}" == "." ]] && continue

            CURRENT=""

            IFS='/' read -ra PARTS <<< "${DIRECTORY}"

            for PART in "${PARTS[@]}"; do

              [[ -z "${PART}" ]] && continue

              if [[ -z "${CURRENT}" ]]; then
                CURRENT="${PART}"
              else
                CURRENT="${CURRENT}/${PART}"
              fi

              echo "${REMOTE_DIR}/${CURRENT}" \
                >> remote_dirs.txt

            done

          done < files.tsv

          sort -u \
            remote_dirs.txt \
            -o remote_dirs.txt

          echo
          echo "=========================================================="
          echo "DIRECTORIOS TERABOX NECESARIOS"
          echo "=========================================================="

          if [[ -s remote_dirs.txt ]]; then
            cat remote_dirs.txt
          else
            echo "No hay subdirectorios."
          fi

          # ------------------------------------------------------
          # Crear carpetas.
          #
          # Si ya existen, no interrumpimos el workflow.
          # ------------------------------------------------------

          while IFS= read -r DIRECTORY; do

            [[ -z "${DIRECTORY}" ]] && continue

            echo
            echo "Creando/verificando:"
            echo "${DIRECTORY}"

            RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --cookie "${TERABOX_COOKIE}" \
                --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                --header "Origin: https://www.terabox.com" \
                --header "Referer: https://www.terabox.com/main" \
                --header "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "path=${DIRECTORY}" \
                --data-urlencode "isdir=1" \
                --data-urlencode "block_list=[]" \
                --data-urlencode "jsToken=${TERABOX_JSTOKEN}" \
                --data-urlencode "app_id=250528" \
                --data-urlencode "web=1" \
                --data-urlencode "channel=dubox" \
                --data-urlencode "clienttype=0" \
                "https://www.terabox.com/api/create"
            )"

            echo "${RESPONSE}"

            ERRNO="$(
              echo "${RESPONSE}" |
              jq -r '.errno // -999'
            )"

            if [[ "${ERRNO}" == "0" ]]; then

              echo "Carpeta creada/verificada correctamente."

            else

              echo "Aviso:"
              echo "La carpeta probablemente ya existe."
              echo "errno=${ERRNO}"

            fi

          done < remote_dirs.txt

      # ==========================================================
      # SUBIR ARCHIVO
      # ==========================================================

      - name: Upload files to TeraBox
        shell: bash
        run: |
          set -euo pipefail

          UPLOAD_HOST="https://c-jp.terabox.com"
          MAX_PARALLEL=8

          upload_file() {

            local FILE="$1"
            local RELATIVE_PATH="$2"

            local FILE_NAME
            FILE_NAME="$(basename "${FILE}")"

            local REMOTE_PATH
            REMOTE_PATH="${REMOTE_DIR}/${RELATIVE_PATH}"

            local TARGET_PATH
            TARGET_PATH="$(dirname "${REMOTE_PATH}")"

            echo
            echo "=========================================================="
            echo "SUBIENDO"
            echo "=========================================================="
            echo "Local : ${FILE}"
            echo "Remote: ${REMOTE_PATH}"
            echo "=========================================================="

            local FILE_SIZE
            FILE_SIZE="$(
              stat -c '%s' "${FILE}"
            )"

            local CHUNK_DIR
            CHUNK_DIR="$(
              mktemp -d
            )"

            local CHUNK_SIZE=$(
              20 * 1024 * 1024
            )

            split \
              -b "${CHUNK_SIZE}" \
              -d \
              -a 6 \
              "${FILE}" \
              "${CHUNK_DIR}/part_"

            local BLOCK_LIST="["
            local FIRST=1
            local PARTSEQ=0

            for PART in "${CHUNK_DIR}"/part_*; do

              local MD5
              MD5="$(
                md5sum "${PART}" |
                awk '{print $1}'
              )"

              if [[ "${FIRST}" -eq 1 ]]; then
                FIRST=0
              else
                BLOCK_LIST+=","
              fi

              BLOCK_LIST+="\"${MD5}\""

              PARTSEQ=$(
                (PARTSEQ + 1)
              )

            done

            BLOCK_LIST+="]"

            echo "Tamaño: ${FILE_SIZE}"
            echo "Chunks: ${PARTSEQ}"

            # ----------------------------------------------------
            # PRECREATE
            # ----------------------------------------------------

            local RESPONSE

            RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --cookie "${TERABOX_COOKIE}" \
                --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                --header "Origin: https://www.terabox.com" \
                --header "Referer: https://www.terabox.com/main" \
                --header "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "path=${REMOTE_PATH}" \
                --data-urlencode "size=${FILE_SIZE}" \
                --data-urlencode "isdir=0" \
                --data-urlencode "autoinit=1" \
                --data-urlencode "target_path=${TARGET_PATH}/" \
                --data-urlencode "block_list=${BLOCK_LIST}" \
                --data-urlencode "jsToken=${TERABOX_JSTOKEN}" \
                --data-urlencode "app_id=250528" \
                --data-urlencode "web=1" \
                --data-urlencode "channel=dubox" \
                --data-urlencode "clienttype=0" \
                "https://www.terabox.com/api/precreate"
            )"

            echo "Precreate:"
            echo "${RESPONSE}"

            local ERRNO
            ERRNO="$(
              echo "${RESPONSE}" |
              jq -r '.errno // -999'
            )"

            if [[ "${ERRNO}" != "0" ]]; then

              echo "::error::Precreate falló."
              rm -rf "${CHUNK_DIR}"

              return 1

            fi

            local UPLOAD_ID
            UPLOAD_ID="$(
              echo "${RESPONSE}" |
              jq -r '.uploadid // empty'
            )"

            if [[ -z "${UPLOAD_ID}" ]]; then

              local RETURN_TYPE
              RETURN_TYPE="$(
                echo "${RESPONSE}" |
                jq -r '.return_type // empty'
              )"

              if [[ "${RETURN_TYPE}" == "2" ]]; then

                echo "El archivo ya existe:"
                echo "${REMOTE_PATH}"

                rm -rf "${CHUNK_DIR}"

                return 0

              fi

              echo "::error::No se recibió uploadid."

              rm -rf "${CHUNK_DIR}"

              return 1

            fi

            # ----------------------------------------------------
            # UPLOAD CHUNKS
            # ----------------------------------------------------

            upload_chunk() {

              local PART="$1"
              local SEQ="$2"

              echo "[${FILE_NAME}] chunk ${SEQ}"

              local UPLOAD_RESPONSE

              UPLOAD_RESPONSE="$(
                curl \
                  --silent \
                  --show-error \
                  --fail-with-body \
                  --request POST \
                  --cookie "${TERABOX_COOKIE}" \
                  --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                  --header "Origin: https://www.terabox.com" \
                  --header "Referer: https://www.terabox.com/main" \
                  --form "file=@${PART}" \
                  "${UPLOAD_HOST}/rest/2.0/pcs/superfile2?method=upload&type=tmpfile&app_id=250528&path=$(printf '%s' "${REMOTE_PATH}" | jq -sRr @uri)&uploadid=${UPLOAD_ID}&partseq=${SEQ}"
              )"

              local ERROR_CODE
              ERROR_CODE="$(
                echo "${UPLOAD_RESPONSE}" |
                jq -r '.error_code // 0'
              )"

              if [[ "${ERROR_CODE}" != "0" ]]; then

                echo "::error::Falló el chunk ${SEQ}."

                echo "${UPLOAD_RESPONSE}"

                return 1

              fi

            }

            local ACTIVE=0
            local SEQ=0
            local PIDS=()

            for PART in "${CHUNK_DIR}"/part_*; do

              upload_chunk \
                "${PART}" \
                "${SEQ}" &

              PIDS+=("$!")

              ACTIVE=$(
                (ACTIVE + 1)
              )

              SEQ=$(
                (SEQ + 1)
              )

              if [[ "${ACTIVE}" -ge "${MAX_PARALLEL}" ]]; then

                for PID in "${PIDS[@]}"; do
                  wait "${PID}"
                done

                PIDS=()
                ACTIVE=0

              fi

            done

            for PID in "${PIDS[@]}"; do
              wait "${PID}"
            done

            # ----------------------------------------------------
            # CREATE FINAL
            # ----------------------------------------------------

            echo "Finalizando ${FILE_NAME}..."

            RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --cookie "${TERABOX_COOKIE}" \
                --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                --header "Origin: https://www.terabox.com" \
                --header "Referer: https://www.terabox.com/main" \
                --header "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "path=${REMOTE_PATH}" \
                --data-urlencode "uploadid=${UPLOAD_ID}" \
                --data-urlencode "target_path=${TARGET_PATH}/" \
                --data-urlencode "size=${FILE_SIZE}" \
                --data-urlencode "block_list=${BLOCK_LIST}" \
                --data-urlencode "rtype=1" \
                --data-urlencode "isdir=0" \
                --data-urlencode "app_id=250528" \
                --data-urlencode "web=1" \
                --data-urlencode "channel=dubox" \
                --data-urlencode "clienttype=0" \
                "https://www.terabox.com/api/create"
            )"

            echo "Create:"
            echo "${RESPONSE}"

            ERRNO="$(
              echo "${RESPONSE}" |
              jq -r '.errno // -999'
            )"

            if [[ "${ERRNO}" != "0" ]]; then

              echo "::error::Create falló."

              rm -rf "${CHUNK_DIR}"

              return 1

            fi

            echo
            echo "=========================================================="
            echo "UPLOAD COMPLETADO"
            echo "=========================================================="
            echo "Archivo: ${REMOTE_PATH}"
            echo "=========================================================="

            rm -rf "${CHUNK_DIR}"
          }


          # ------------------------------------------------------
          # SUBIR TODOS LOS ARCHIVOS
          # ------------------------------------------------------

          while IFS=$'\t' read -r RELATIVE_PATH URL; do

            [[ -z "${RELATIVE_PATH}" ]] && continue

            FILE="downloaded/${RELATIVE_PATH}"

            if [[ ! -f "${FILE}" ]]; then

              echo "::error::No existe:"
              echo "${FILE}"

              exit 1

            fi

            upload_file \
              "${FILE}" \
              "${RELATIVE_PATH}"

          done < files.tsv

      # ==========================================================
      # RESULTADO
      # ==========================================================

      - name: Show result
        shell: bash
        env:
          INPUT_URL: ${{ inputs.download_url }}
        run: |
          set -euo pipefail

          echo
          echo "=========================================================="
          echo "UPLOAD COMPLETADO CORRECTAMENTE"
          echo "=========================================================="
          echo
          echo "Origen:"
          echo "${INPUT_URL}"
          echo
          echo "Destino:"
          echo "${REMOTE_DIR}"
          echo
          echo "Archivos:"
          find downloaded \
            -type f \
            -printf '  - %P\n'
          echo
          echo "=========================================================="
