name: Download and Upload to TeraBox Premium (Parallel Matrix)

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "URL HTTP/HTTPS de un archivo o carpeta h5ai"
        required: true
        type: string

jobs:
  # ==========================================================
  # JOB 1: DESCUBRIR ARCHIVOS Y CREAR LA MATRIZ
  # ==========================================================
  discover-files:
    name: Discover h5ai Files
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 jq

      - name: Crawl and generate matrix
        id: set-matrix
        shell: bash
        env:
          INPUT_URL: ${{ inputs.download_url }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import ssl
          import json
          import posixpath
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse, unquote
          from urllib.request import Request, urlopen

          INPUT_URL = os.environ["INPUT_URL"]

          USER_AGENT = (
              "Mozilla/5.0 (X11; Linux x86_64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/151.0 Safari/537.36"
          )

          SSL_CONTEXT = ssl.create_default_context()

          class H5AIParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current_li_classes = set()
                  self.current_href = None
                  self.in_fb_name = False
                  self.files = []
                  self.folders = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "li":
                      classes = set(attrs.get("class", "").split())
                      if "item" in classes:
                          self.current_li_classes = classes
                      else:
                          self.current_li_classes = set()
                  elif tag == "a":
                      href = attrs.get("href")
                      if not href:
                          return
                      if self.current_li_classes:
                          self.current_href = href
                      if self.in_fb_name:
                          self.current_href = href
                  elif tag == "td":
                      classes = set(attrs.get("class", "").split())
                      if "fb-n" in classes:
                          self.in_fb_name = True

              def handle_endtag(self, tag):
                  if tag == "td":
                      self.in_fb_name = False
                  elif tag == "a":
                      href = self.current_href
                      if href:
                          href = href.strip()
                          if href not in ("", ".", "..", "../"):
                              if href.startswith("#") or href.lower().startswith("javascript:") or "/_h5ai/" in href:
                                  pass
                              elif "file" in self.current_li_classes:
                                  self.files.append(href)
                              elif "folder" in self.current_li_classes:
                                  self.folders.append(href)
                              else:
                                  if href.endswith("/"):
                                      self.folders.append(href)
                                  else:
                                      self.files.append(href)
                      self.current_href = None
                  elif tag == "li":
                      self.current_li_classes = set()

          visited = set()
          discovered_files = {}

          def fetch(url):
              request = Request(
                  url,
                  headers={"User-Agent": USER_AGENT, "Accept": "text/html,application/xhtml+xml"}
              )
              with urlopen(request, context=SSL_CONTEXT, timeout=60) as response:
                  content_type = response.headers.get("Content-Type", "")
                  body = response.read()
              return content_type, body

          def is_html(content_type, body):
              if "html" in content_type.lower():
                  return True
              start = body[:1000].lstrip().lower()
              return (start.startswith(b"<!doctype html") or start.startswith(b"<html") or b"<body" in start)

          def get_filename(url):
              path = urlparse(url).path.rstrip("/")
              if not path:
                  return None
              return unquote(path.split("/")[-1])

          def crawl(directory_url, relative_path=""):
              directory_url = directory_url.rstrip("/") + "/"
              if directory_url in visited:
                  return
              visited.add(directory_url)
              try:
                  content_type, body = fetch(directory_url)
              except Exception as error:
                  print(f"ERROR accediendo a {directory_url}: {error}")
                  return

              if not is_html(content_type, body):
                  name = get_filename(directory_url)
                  if name:
                      discovered_files[relative_path + name] = directory_url
                  return

              html = body.decode("utf-8", errors="ignore")
              parser = H5AIParser()
              parser.feed(html)

              for href in parser.files:
                  full_url = urljoin(directory_url, href)
                  if "/_h5ai/" in urlparse(full_url).path:
                      continue
                  name = get_filename(full_url)
                  if not name:
                      continue
                  discovered_files[relative_path + name] = full_url

              for href in parser.folders:
                  if href in (".", "..", "../"):
                      continue
                  full_url = urljoin(directory_url, href)
                  if "/_h5ai/" in urlparse(full_url).path:
                      continue
                  parsed_path = urlparse(full_url).path.rstrip("/")
                  folder_name = unquote(parsed_path.split("/")[-1])
                  if not folder_name:
                      continue
                  crawl(full_url, relative_path + folder_name + "/")

          parsed = urlparse(INPUT_URL)
          if not parsed.path.endswith("/"):
              name = get_filename(INPUT_URL)
              if not name:
                  raise SystemExit("No se pudo determinar el nombre del archivo.")
              discovered_files[name] = INPUT_URL
          else:
              crawl(INPUT_URL)

          if not discovered_files:
              raise SystemExit("No se encontraron archivos.")

          # Calcular el directorio base remoto de TeraBox
          url_path = parsed.path
          if url_path.endswith('/'):
              url_path = url_path.rstrip('/')
          else:
              url_path = posixpath.dirname(url_path)

          if not url_path or url_path == '/':
              base_remote_dir = '/Archive'
          else:
              base_remote_dir = f'/Archive{url_path}'

          # Crear Matriz JSON
          matrix = []
          for rel_path, url in sorted(discovered_files.items()):
              matrix.append({
                  "relative_path": rel_path,
                  "url": url,
                  "remote_dir": base_remote_dir
              })

          with open("matrix.json", "w", encoding="utf-8") as f:
              json.dump(matrix, f)
          PY

          echo "=========================================================="
          echo "ARCHIVOS ENCONTRADOS (MATRIZ)"
          echo "=========================================================="
          cat matrix.json | jq .

          # Exportar la matriz para que el siguiente Job la pueda usar
          echo "matrix=$(jq -c . matrix.json)" >> $GITHUB_OUTPUT

  # ==========================================================
  # JOB 2: DESCARGAR Y SUBIR EN PARALELO (MÚLTIPLES RUNNERS)
  # ==========================================================
  download-and-upload:
    name: Upload ${{ matrix.file.relative_path }}
    needs: discover-files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Si un archivo falla, los demás siguen corriendo
      matrix:
        file: ${{ fromJson(needs.discover-files.outputs.matrix) }}
        
    env:
      TERABOX_JSTOKEN: ${{ secrets.TERABOX_JSTOKEN }}
      TERABOX_COOKIE: ${{ secrets.TERABOX_COOKIE }}

    steps:
      - name: Check inputs and environment
        shell: bash
        run: |
          if [[ -z "${TERABOX_COOKIE}" ]] || [[ -z "${TERABOX_JSTOKEN}" ]]; then
            echo "::error::Los secrets de TERABOX no están configurados."
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 curl jq

      - name: Download file with aria2
        shell: bash
        run: |
          set -euo pipefail
          
          FILE_URL="${{ matrix.file.url }}"
          RELATIVE_PATH="${{ matrix.file.relative_path }}"
          DIR_NAME="$(dirname "${RELATIVE_PATH}")"
          FILE_NAME="$(basename "${RELATIVE_PATH}")"
          
          # Crear carpeta local
          mkdir -p "downloaded/${DIR_NAME}"

          echo "Descargando: ${FILE_NAME}"
          
          aria2c \
            --dir="downloaded/${DIR_NAME}" \
            --out="${FILE_NAME}" \
            --continue=true \
            --allow-overwrite=true \
            --auto-file-renaming=false \
            --max-concurrent-downloads=4 \
            --split=16 \
            --max-connection-per-server=16 \
            --min-split-size=10M \
            --console-log-level=notice \
            "${FILE_URL}"

          echo "Descarga completada: downloaded/${RELATIVE_PATH}"

      - name: Create TeraBox directories
        shell: bash
        run: |
          set -euo pipefail
          
          RELATIVE_PATH="${{ matrix.file.relative_path }}"
          REMOTE_DIR="${{ matrix.file.remote_dir }}"
          DIRECTORY="$(dirname "${RELATIVE_PATH}")"
          
          [[ "${DIRECTORY}" == "." ]] && exit 0 # No hay subcarpetas que crear

          CURRENT=""
          IFS='/' read -ra PARTS <<< "${DIRECTORY}"
          
          for PART in "${PARTS[@]}"; do
            [[ -z "${PART}" ]] && continue
            if [[ -z "${CURRENT}" ]]; then
              CURRENT="${PART}"
            else
              CURRENT="${CURRENT}/${PART}"
            fi
            
            TARGET_DIR="${REMOTE_DIR}/${CURRENT}"
            echo "Verificando/Creando carpeta en TeraBox: ${TARGET_DIR}"
            
            RESPONSE="$(
              curl -s --show-error -X POST \
                --cookie "${TERABOX_COOKIE}" \
                --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                --header "Origin: https://www.terabox.com" \
                --header "Referer: https://www.terabox.com/main" \
                --header "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "path=${TARGET_DIR}" \
                --data-urlencode "isdir=1" \
                --data-urlencode "block_list=[]" \
                --data-urlencode "jsToken=${TERABOX_JSTOKEN}" \
                --data-urlencode "app_id=250528" \
                --data-urlencode "web=1" \
                --data-urlencode "channel=dubox" \
                --data-urlencode "clienttype=0" \
                "https://www.terabox.com/api/create"
            )"
            
            ERRNO="$(echo "${RESPONSE}" | jq -r '.errno // -999')"
            if [[ "${ERRNO}" == "0" ]]; then
              echo "Carpeta creada exitosamente."
            else
              echo "La carpeta probablemente ya existe (errno=${ERRNO})."
            fi
          done

      - name: Upload file to TeraBox
        shell: bash
        run: |
          set -euo pipefail
          
          RELATIVE_PATH="${{ matrix.file.relative_path }}"
          REMOTE_DIR="${{ matrix.file.remote_dir }}"
          FILE="downloaded/${RELATIVE_PATH}"
          
          UPLOAD_HOST="https://c-jp.terabox.com"
          MAX_PARALLEL=8
          
          FILE_NAME="$(basename "${FILE}")"
          REMOTE_PATH="${REMOTE_DIR}/${RELATIVE_PATH}"
          TARGET_PATH="$(dirname "${REMOTE_PATH}")"

          echo "=========================================================="
          echo "SUBIENDO ARCHIVO"
          echo "Local : ${FILE}"
          echo "Remote: ${REMOTE_PATH}"
          echo "=========================================================="

          FILE_SIZE="$(stat -c '%s' "${FILE}")"
          CHUNK_SIZE=$((20 * 1024 * 1024))
          CHUNK_DIR="$(mktemp -d)"

          split -b "${CHUNK_SIZE}" -d -a 6 "${FILE}" "${CHUNK_DIR}/part_"

          BLOCK_LIST="["
          FIRST=1
          PARTSEQ=0

          for PART in "${CHUNK_DIR}"/part_*; do
            MD5="$(md5sum "${PART}" | awk '{print $1}')"
            if [[ "${FIRST}" -eq 1 ]]; then
              FIRST=0
            else
              BLOCK_LIST+=","
            fi
            BLOCK_LIST+="\"${MD5}\""
            PARTSEQ=$((PARTSEQ + 1))
          done
          BLOCK_LIST+="]"

          # PRECREATE
          RESPONSE="$(
            curl -s --show-error -X POST \
              --cookie "${TERABOX_COOKIE}" \
              --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
              --header "Origin: https://www.terabox.com" \
              --header "Referer: https://www.terabox.com/main" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "path=${REMOTE_PATH}" \
              --data-urlencode "size=${FILE_SIZE}" \
              --data-urlencode "isdir=0" \
              --data-urlencode "autoinit=1" \
              --data-urlencode "target_path=${TARGET_PATH}/" \
              --data-urlencode "block_list=${BLOCK_LIST}" \
              --data-urlencode "jsToken=${TERABOX_JSTOKEN}" \
              --data-urlencode "app_id=250528" \
              --data-urlencode "web=1" \
              --data-urlencode "channel=dubox" \
              --data-urlencode "clienttype=0" \
              "https://www.terabox.com/api/precreate"
          )"

          ERRNO="$(echo "${RESPONSE}" | jq -r '.errno // -999')"
          if [[ "${ERRNO}" != "0" ]]; then
            echo "::error::Precreate falló para ${FILE_NAME}"
            exit 1
          fi

          UPLOAD_ID="$(echo "${RESPONSE}" | jq -r '.uploadid // empty')"
          if [[ -z "${UPLOAD_ID}" ]]; then
            RETURN_TYPE="$(echo "${RESPONSE}" | jq -r '.return_type // empty')"
            if [[ "${RETURN_TYPE}" == "2" ]]; then
              echo "El archivo ya existe en TeraBox: ${REMOTE_PATH}"
              exit 0
            fi
            echo "::error::No se recibió uploadid."
            exit 1
          fi

          # SUBIR CHUNKS EN PARALELO
          upload_chunk() {
            local PART="$1"
            local SEQ="$2"
            echo "[${FILE_NAME}] Subiendo chunk ${SEQ}..."
            
            local UPLOAD_RESPONSE
            UPLOAD_RESPONSE="$(
              curl -s --show-error -X POST \
                --cookie "${TERABOX_COOKIE}" \
                --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                --header "Origin: https://www.terabox.com" \
                --header "Referer: https://www.terabox.com/main" \
                --form "file=@${PART}" \
                "${UPLOAD_HOST}/rest/2.0/pcs/superfile2?method=upload&type=tmpfile&app_id=250528&path=$(printf '%s' "${REMOTE_PATH}" | jq -sRr @uri)&uploadid=${UPLOAD_ID}&partseq=${SEQ}"
            )"

            local ERROR_CODE
            ERROR_CODE="$(echo "${UPLOAD_RESPONSE}" | jq -r '.error_code // 0')"
            if [[ "${ERROR_CODE}" != "0" ]]; then
              echo "::error::Falló chunk ${SEQ}"
              echo "${UPLOAD_RESPONSE}"
              return 1
            fi
          }

          ACTIVE=0
          SEQ=0
          PIDS=()

          for PART in "${CHUNK_DIR}"/part_*; do
            upload_chunk "${PART}" "${SEQ}" &
            PIDS+=("$!")
            ACTIVE=$((ACTIVE + 1))
            SEQ=$((SEQ + 1))

            if [[ "${ACTIVE}" -ge "${MAX_PARALLEL}" ]]; then
              for PID in "${PIDS[@]}"; do wait "${PID}"; done
              PIDS=()
              ACTIVE=0
            fi
          done
          for PID in "${PIDS[@]}"; do wait "${PID}"; done

          # CREATE (FINALIZAR)
          echo "Finalizando upload de ${FILE_NAME}..."
          RESPONSE="$(
            curl -s --show-error -X POST \
              --cookie "${TERABOX_COOKIE}" \
              --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
              --header "Origin: https://www.terabox.com" \
              --header "Referer: https://www.terabox.com/main" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "path=${REMOTE_PATH}" \
              --data-urlencode "uploadid=${UPLOAD_ID}" \
              --data-urlencode "target_path=${TARGET_PATH}/" \
              --data-urlencode "size=${FILE_SIZE}" \
              --data-urlencode "block_list=${BLOCK_LIST}" \
              --data-urlencode "rtype=1" \
              --data-urlencode "isdir=0" \
              --data-urlencode "app_id=250528" \
              --data-urlencode "web=1" \
              --data-urlencode "channel=dubox" \
              --data-urlencode "clienttype=0" \
              "https://www.terabox.com/api/create"
          )"

          ERRNO="$(echo "${RESPONSE}" | jq -r '.errno // -999')"
          if [[ "${ERRNO}" != "0" ]]; then
            echo "::error::Create falló para ${FILE_NAME}"
            exit 1
          fi

          echo "=========================================================="
          echo "¡UPLOAD COMPLETADO CORRECTAMENTE!"
          echo "Archivo subido a: ${REMOTE_PATH}"
          echo "=========================================================="
