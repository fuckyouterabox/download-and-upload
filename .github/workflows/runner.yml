name: Download and Upload to TeraBox Premium

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "URL HTTP/HTTPS del archivo que se desea descargar"
        required: true
        type: string

jobs:
  upload-to-terabox:
    name: Premium Parallel Download and Upload
    runs-on: ubuntu-latest

    env:
      TERABOX_JSTOKEN: ${{ secrets.TERABOX_JSTOKEN }}
      TERABOX_COOKIE: ${{ secrets.TERABOX_COOKIE }}

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update -y
          sudo apt-get install -y aria2 curl jq

          aria2c --version
          curl --version
          jq --version

      - name: Check inputs and environment
        shell: bash
        run: |
          set -euxo pipefail

          if [[ -z "${TERABOX_COOKIE}" ]]; then
            echo "::error::El secret TERABOX_COOKIE no está configurado."
            exit 1
          fi

          if [[ -z "${{ inputs.download_url }}" ]]; then
            echo "::error::No se proporcionó una URL de descarga."
            exit 1
          fi

      - name: Download requested file with aria2
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p downloaded

          URL="${{ inputs.download_url }}"
          FILE_NAME="$(basename "${URL%%\?*}")"

          if [[ -z "${FILE_NAME}" || "${FILE_NAME}" == "/" || "${FILE_NAME}" == "." ]]; then
            echo "::error::No se pudo determinar el nombre del archivo desde la URL."
            exit 1
          fi

          echo "Descargando: ${URL}"
          echo "Archivo: ${FILE_NAME}"

          aria2c \
            -x 16 \
            -s 16 \
            --console-log-level=notice \
            --dir=downloaded \
            --out="${FILE_NAME}" \
            "${URL}"

          echo "DOWNLOADED_FILE=downloaded/${FILE_NAME}" >> "$GITHUB_ENV"

      - name: Build TeraBox destination path
        shell: bash
        run: |
          set -euxo pipefail

          URL="${{ inputs.download_url }}"

          # Extrae únicamente el path de la URL.
          URL_PATH="$(printf '%s' "${URL}" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://[^/]+##')"
          URL_PATH="${URL_PATH%%\?*}"
          URL_PATH="${URL_PATH%%\#*}"

          if [[ -z "${URL_PATH}" || "${URL_PATH}" == "/" ]]; then
            echo "::error::No se pudo obtener la ruta desde la URL."
            exit 1
          fi

          REMOTE_PATH="/Archive${URL_PATH}"

          echo "URL: ${URL}"
          echo "URL path: ${URL_PATH}"
          echo "Destino TeraBox: ${REMOTE_PATH}"

          echo "REMOTE_PATH=${REMOTE_PATH}" >> "$GITHUB_ENV"

      - name: Prepare upload chunks
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p chunks

          FILE_SIZE="$(stat -c '%s' "${DOWNLOADED_FILE}")"
          CHUNK_SIZE=$((20 * 1024 * 1024))

          echo "Archivo: ${DOWNLOADED_FILE}"
          echo "Tamaño: ${FILE_SIZE} bytes"
          echo "Chunk size: ${CHUNK_SIZE} bytes"

          split \
            -b "${CHUNK_SIZE}" \
            -d \
            -a 6 \
            "${DOWNLOADED_FILE}" \
            chunks/part_

          BLOCK_LIST="["
          FIRST=1
          PARTSEQ=0

          for PART in chunks/part_*; do
            MD5="$(md5sum "${PART}" | awk '{print $1}')"

            echo "=========================================="
            echo "Chunk: ${PARTSEQ}"
            echo "File : ${PART}"
            echo "MD5  : ${MD5}"
            echo "=========================================="

            if [[ "${FIRST}" -eq 1 ]]; then
              FIRST=0
            else
              BLOCK_LIST+=","
            fi

            BLOCK_LIST+="\"${MD5}\""

            PARTSEQ=$((PARTSEQ + 1))
          done

          BLOCK_LIST+="]"

          echo "FILE_SIZE=${FILE_SIZE}" >> "$GITHUB_ENV"
          echo "BLOCK_LIST=${BLOCK_LIST}" >> "$GITHUB_ENV"

          echo "Block list: ${BLOCK_LIST}"

      - name: Pre-create file in TeraBox
        shell: bash
        run: |
          set -euxo pipefail

          PRECREATE_URL="https://www.terabox.com/api/precreate"

          echo "Ejecutando precreate..."

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request POST \
              --cookie "${TERABOX_COOKIE}" \
              --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
              --header "Origin: https://www.terabox.com" \
              --header "Referer: https://www.terabox.com/main" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "path=${REMOTE_PATH}" \
              --data-urlencode "size=${FILE_SIZE}" \
              --data-urlencode "isdir=0" \
              --data-urlencode "autoinit=1" \
              --data-urlencode "target_path=$(dirname "${REMOTE_PATH}")" \
              --data-urlencode "block_list=${BLOCK_LIST}" \
              --data-urlencode "jsToken=${TERABOX_JSTOKEN}" \
              --data-urlencode "app_id=250528" \
              --data-urlencode "web=1" \
              --data-urlencode "channel=dubox" \
              --data-urlencode "clienttype=0" \
              "${PRECREATE_URL}"
          )"

          echo "Precreate response:"
          echo "${RESPONSE}"

          ERRNO="$(echo "${RESPONSE}" | jq -r '.errno // -999')"

          if [[ "${ERRNO}" != "0" ]]; then
            echo "::error::El precreate falló."
            exit 1
          fi

          UPLOAD_ID="$(echo "${RESPONSE}" | jq -r '.uploadid // empty')"

          if [[ -z "${UPLOAD_ID}" ]]; then
            RETURN_TYPE="$(echo "${RESPONSE}" | jq -r '.return_type // empty')"

            if [[ "${RETURN_TYPE}" == "2" ]]; then
              echo "TeraBox indicó que el archivo ya existe."
              exit 0
            fi

            echo "::error::No se recibió uploadid."
            exit 1
          fi

          echo "UPLOAD_ID=${UPLOAD_ID}" >> "$GITHUB_ENV"

          echo "Upload ID: ${UPLOAD_ID}"

      - name: Upload chunks in parallel
        shell: bash
        run: |
          set -euxo pipefail

          UPLOAD_HOST="https://c-jp.terabox.com"
          MAX_PARALLEL=8

          upload_chunk() {
            local PART="$1"
            local SEQ="$2"

            echo "[$SEQ] Uploading ${PART}"

            RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --cookie "${TERABOX_COOKIE}" \
                --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
                --header "Origin: https://www.terabox.com" \
                --header "Referer: https://www.terabox.com/main" \
                --form "file=@${PART}" \
                "${UPLOAD_HOST}/rest/2.0/pcs/superfile2?method=upload&type=tmpfile&app_id=250528&path=$(printf '%s' "${REMOTE_PATH}" | jq -sRr @uri)&uploadid=${UPLOAD_ID}&partseq=${SEQ}"
            )"

            echo "[$SEQ] Response: ${RESPONSE}"

            ERROR_CODE="$(echo "${RESPONSE}" | jq -r '.error_code // 0')"

            if [[ "${ERROR_CODE}" != "0" ]]; then
              echo "::error::Falló el chunk ${SEQ}: ${RESPONSE}"
              return 1
            fi
          }

          ACTIVE=0
          SEQ=0
          PIDS=()

          for PART in chunks/part_*; do
            upload_chunk "${PART}" "${SEQ}" &

            PIDS+=("$!")
            ACTIVE=$((ACTIVE + 1))
            SEQ=$((SEQ + 1))

            if [[ "${ACTIVE}" -ge "${MAX_PARALLEL}" ]]; then
              for PID in "${PIDS[@]}"; do
                wait "${PID}"
              done

              PIDS=()
              ACTIVE=0
            fi
          done

          for PID in "${PIDS[@]}"; do
            wait "${PID}"
          done

          echo "Todos los chunks fueron subidos."

      - name: Create final file in TeraBox
        shell: bash
        run: |
          set -euxo pipefail

          CREATE_URL="https://www.terabox.com/api/create"

          echo "Finalizando archivo..."

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request POST \
              --cookie "${TERABOX_COOKIE}" \
              --header "User-Agent: netdisk;P2SP;3.0.0.8;netdisk;11.4.5.1;PC;PC-Windows;10.0.19044" \
              --header "Origin: https://www.terabox.com" \
              --header "Referer: https://www.terabox.com/main" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "path=${REMOTE_PATH}" \
              --data-urlencode "uploadid=${UPLOAD_ID}" \
              --data-urlencode "target_path=$(dirname "${REMOTE_PATH}")/" \
              --data-urlencode "size=${FILE_SIZE}" \
              --data-urlencode "block_list=${BLOCK_LIST}" \
              --data-urlencode "rtype=1" \
              --data-urlencode "isdir=0" \
              --data-urlencode "app_id=250528" \
              --data-urlencode "web=1" \
              --data-urlencode "channel=dubox" \
              --data-urlencode "clienttype=0" \
              "${CREATE_URL}"
          )"

          echo "Create response:"
          echo "${RESPONSE}"

          ERRNO="$(echo "${RESPONSE}" | jq -r '.errno // -999')"

          if [[ "${ERRNO}" != "0" ]]; then
            echo "::error::La creación final del archivo falló."
            exit 1
          fi

          echo "=========================================================="
          echo "¡SUBIDA COMPLETADA CON ÉXITO!"
          echo "=========================================================="
          echo "Archivo local : ${DOWNLOADED_FILE}"
          echo "Archivo remoto: ${REMOTE_PATH}"
          echo "Tamaño        : ${FILE_SIZE} bytes"
          echo "=========================================================="

      - name: Show result
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "Premium Upload completed successfully"
          echo "File: ${DOWNLOADED_FILE}"
          echo "Remote path: ${REMOTE_PATH}"
          echo "=========================================================="
